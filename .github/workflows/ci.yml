name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Run tests
        # Tests run against an in-memory SQLite DB (see tests/conftest.py),
        # never a real Postgres — no services/DB setup needed here.
        run: uv run pytest -q

  userbot-lint:
    name: Userbot lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: userbot
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      # Run ruff in an isolated tool environment (uvx), without installing
      # the project's own runtime dependencies — tgcrypto (pulled in by
      # pyrogram) has no prebuilt wheel for this Python version and would
      # need a full C build toolchain just to lint the code.
      - name: Lint (ruff)
        run: uvx ruff check .

  frontend-checks:
    name: Frontend lint, type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Type-check & build
        run: npm run build
