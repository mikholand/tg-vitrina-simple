[project]
name = "vitrina-userbot"
version = "0.1.0"
description = "Pyrogram userbot: resumable channel-history backfill for the storefront"
requires-python = ">=3.12"
dependencies = [
    "pyrogram>=2.0.106",
    "tgcrypto>=1.2.5",
    "httpx>=0.27",
    "structlog>=24.4",
    "pydantic-settings>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
