<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="light dark" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <!-- Static fallback shown before JS loads store info — App.vue overwrites
         this (and the tags below) with the real shop name/description/logo
         once `fetchStoreInfo()` resolves. Crawlers that execute JS (Google)
         pick up the updated values; plain link-unfurlers (most messengers)
         only ever see this static version, which is why it still needs to
         read as a reasonable, non-empty default rather than a placeholder. -->
    <title>Магазин</title>
    <meta name="description" content="Каталог товаров и быстрый заказ прямо в Telegram." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Магазин" />
    <meta property="og:description" content="Каталог товаров и быстрый заказ прямо в Telegram." />
    <meta name="twitter:card" content="summary" />
    <!-- Sets `data-theme` on <html> before any CSS loads, so the correct
         `:root`/`:root[data-theme="dark"]` block in styles/main.css applies
         from the very first paint instead of flashing the other scheme.
         Only localStorage + the OS prefers-color-scheme query are available
         this early — `telegram-web-app.js` (loaded further down, in body;
         see the comment there for why it isn't here instead) hasn't run
         yet, so Telegram's own colorScheme can't be consulted synchronously.
         shared/theme/theme.ts re-resolves against Telegram's value once
         that script has loaded and corrects `data-theme` if it disagrees —
         same "read fast, correct once the real answer is known" tradeoff
         index.html already makes elsewhere (see the static SEO meta tags
         above, upgraded once fetchStoreInfo() resolves). -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('sf-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          // Storage/matchMedia unavailable — falls through to main.css's
          // default `:root` (light) block, same as a browser with no
          // opinion either way.
        }
      })()
    </script>
    <!-- Pure CSS, no JS/framework dependency — paints on first frame, before
         the bundled JS has even been fetched/parsed, let alone before
         router.isReady() resolves (main.ts delays app.mount() until then so
         a deep link lands directly on its real destination instead of
         flashing the home page first — see main.ts for the full story).
         Colors match --sf-bg/--sf-accent/--sf-line from styles/main.css,
         hardcoded here since this markup renders before that stylesheet (or
         any Vue CSS) is applied — including the light/dark split, keyed off
         the same `data-theme` attribute the script above already set. -->
    <style>
      #app-preloader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
      }
      html[data-theme='dark'] #app-preloader {
        background: #121212;
      }
      #app-preloader__spinner {
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 50%;
        border: 3px solid #e7e0d2;
        border-top-color: #c9a15a;
        animation: app-preloader-spin 0.8s linear infinite;
      }
      html[data-theme='dark'] #app-preloader__spinner {
        border-color: #2e2e2e;
        border-top-color: #c9a15a;
      }
      @keyframes app-preloader-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Vue's app.mount('#app') replaces this entire subtree the instant
           it actually runs, so there's no manual teardown to wire up. -->
      <div id="app-preloader">
        <div id="app-preloader__spinner"></div>
      </div>
    </div>
    <!-- Dismisses Telegram's own native launch placeholder (the chat-header
         chrome + "Загрузка…" text + bot name shown while the client is still
         setting up the WebView) the instant that's possible — right here,
         right after the static preloader above has been parsed, so the
         handoff Telegram does is placeholder -> our spinner, not
         placeholder -> a blank unstyled page.
         This is a hand-written, minimal reimplementation of the single
         `web_app_ready` event that `telegram-web-app.js`'s `WebApp.ready()`
         posts (see that file's `postEvent()` — the three branches below
         mirror it exactly: native app bridge, old-style `window.external`
         bridge, or `postMessage` to the parent frame for Telegram
         Web/Desktop). It's duplicated here, by hand, specifically so this
         one event doesn't have to wait on fetching+parsing+executing the
         *entire* 120KB telegram-web-app.js file first — that full script is
         still loaded right below (other calls, like `expand()` and
         `disableVerticalSwipes()` in `initTelegram()`, do need all of it),
         but only this one event is time-critical enough to justify a
         hand-rolled duplicate. Calling the real `WebApp.ready()` again below
         once the full script loads is harmless/idempotent — Telegram simply
         ignores a second `web_app_ready`. -->
    <script>
      (function () {
        try {
          var isIframe = window.parent != null && window != window.parent
          if (window.TelegramWebviewProxy !== undefined) {
            TelegramWebviewProxy.postEvent('web_app_ready', JSON.stringify(''))
          } else if (window.external && 'notify' in window.external) {
            window.external.notify(JSON.stringify({ eventType: 'web_app_ready', eventData: '' }))
          } else if (isIframe) {
            window.parent.postMessage(
              JSON.stringify({ eventType: 'web_app_ready', eventData: '' }),
              '*',
            )
          }
        } catch (e) {
          // Not inside Telegram (or an unrecognized client) — no placeholder
          // to dismiss anyway.
        }
      })()
    </script>
    <!-- Non-module script: executes immediately, in order, before the
         deferred `type="module"` script below — so `window.Telegram.WebApp`
         exists by the time `main.ts`/`initTelegram()` runs. Self-hosted
         copy; see the comment at the top of that file for why. -->
    <script src="/js/telegram-web-app.js"></script>
    <script>
      try {
        window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.ready()
      } catch (e) {
        // Not supported by this client — no placeholder to dismiss anyway
        // (and the hand-rolled call above already covered the clients that
        // do have one).
      }
    </script>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
