# Serves the built Vue3/Vite SPA and reverse-proxies API/media calls to the
# backend service so the frontend's axios client (baseURL "/api/v1" — see
# src/shared/api/http.ts) and any <img src="/media/..."> references work
# same-origin, without CORS, in both dev and prod.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- API: proxy everything under /api/ to the backend service --------
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Media: downloaded Telegram photos, served by the backend's
    # StaticFiles mount at /media -------------------------------------------
    location /media/ {
        proxy_pass http://backend:8000/media/;
        proxy_set_header Host $host;
    }

    # --- SEO: robots.txt / sitemap.xml must live at the site root to be
    # recognized by crawlers, but their content is dynamic (sitemap lists
    # live published products; robots.txt's Sitemap: line needs the
    # configured domain) — proxied straight to the backend's catalog router
    # (see app/api/catalog.py) rather than built as static frontend files. --
    location = /robots.txt {
        proxy_pass http://backend:8000/api/v1/catalog/robots.txt;
        proxy_set_header Host $host;
    }

    location = /sitemap.xml {
        proxy_pass http://backend:8000/api/v1/catalog/sitemap.xml;
        proxy_set_header Host $host;
    }

    # --- Hashed static assets (JS/CSS/images with content hash in the
    # filename, as produced by Vite) — safe to cache "forever" ---------------
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- SPA entry point: never cache, always re-validate ------------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # --- SPA fallback: client-side routing ----------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
